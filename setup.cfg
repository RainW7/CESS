[metadata]
name = cess
version = attr: cess._version.__version__
description = One-dimensional CSST slitless spectroscopy simulations
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/RainW7/CESS
license_expression = MIT
license_files =
    LICENSE
    RESOURCE_NOTICE.md
classifiers =
    Development Status :: 4 - Beta
    Intended Audience :: Science/Research
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.12
    Topic :: Scientific/Engineering :: Astronomy

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.12,<3.13
include_package_data = True
zip_safe = False
install_requires =
    astropy==8.0.2
    h5py==3.16.0
    numpy==2.5.4
    scipy==1.18.1
    specutils==2.4.0
    tqdm==4.70.1

[options.packages.find]
where = src

[options.package_data]
cess =
    data/emulator_parameters.json
    data/basic_file/*.fits
    data/basic_file/*.pkl
    data/csst_sls_tp/*.fits
    data/csst_phot_tp/*.fits

[options.extras_require]
tools =
    pandas==3.1.0
plot =
    matplotlib==3.11.2
viewer =
    matplotlib==3.11.2
render =
    galsim==2.8.5
test =
    pytest==9.1.1
    setuptools>=84.2.1,<85
    wheel>=0.48,<0.49

[options.entry_points]
console_scripts =
    cess = cess.cli.main:main
    cess-profile-library = cess.morphology.profile_generator:main
    cess-mge-library = cess.morphology.generator:main
    cess-extract = cess.io.sampling:cli_main
    cess-viewer = cess.viewer:main
